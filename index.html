<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Hunters</title>
    <link rel="stylesheet" href="assets/StyleSheet/master.css">
    <link rel="stylesheet" href="assets/StyleSheet/output.css">
    <link rel="stylesheet" href="assets/Font/font/style.css">
    <link rel="stylesheet" href="assets/Font/FontSocials/style.css">

    <!-- npx @tailwindcss/cli -i ./assets/StyleSheet/master.css -o ./assets/StyleSheet/output.css --watch -->
</head>

<body class="h-[500vh]">

    <!--==================#1 HEADER HTML ==================-->
    <!--===================================================-->
    <header
        class=" container flex bg-[#171717] w-[95%] rounded-[50px] px-7 justify-between items-center content-center fixed top-8 left-1/2 -translate-x-6/12 duration-75 *:text-white lg:w-[90%] xl:w-3/4 z-10">

        <div class="flex gap-x-16 h-full items-center ">
            <!--==================#1-1 LOGO HTML ==================-->
            <figure class=" w-7 py-2">
                <img class="w-max h-max object-cover lg:hidde wn" src="assets/Images/vh-logo-sm-692cb48e.webp" alt="">
                <img class="hidden w-max h-max object-cover absolute left-0 top-[50%] translate-y-[-50%] translate-x-[-5%] lg:block  lg:w-20"
                    src="assets/Images/vh-logo-lg-0eb785ac.webp" alt="">
            </figure>

            <!--==================#1-2 MENU HTML ==================-->
            <nav class="hidden lg:flex h-full text-[14px] font-semibold">
                <ul
                    class="flex gap-5 h-full *:flex *:uppercase *:duration-500 *:border-b-4 *:border-b-transparent *:hover:border-b-orange-400">
                    <li class="*:py-5"><a href="">gear</a></li>
                    <li class="*:py-5"><a href="">armory</a></li>
                    <li class="*:py-5"><a href="">servers</a></li>
                    <li class="*:py-5"><a href="">how to play</a></li>
                    <li class="*:py-5"><a href="">more <i class="icon"></i></a></li>
                </ul>
            </nav>
        </div>

        <!--==================#1-3 BUTTONS HTML ==================-->
        <div
            class="flex gap-x-1 text-[11px] font-bold *:py-1 *:px-3 *:uppercase *:rounded-[50px] *:duration-500 *:hover:-translate-y-1">
            <i class="icon text-2xl lg:hidden"></i>
            <a class="hidden lg:block bg-[#313131]" href="">twitch companions <i class="icon"></i></a>
            <a class="hidden lg:block bg-[#313131]" href="">patch notes</a>
            <a class="hidden lg:block bg-orange-400 text-black shadow-inner shadow-[#fdd995]" href="">login</a>
        </div>
    </header>

    <!--==================#2 CONTENT HTML ==================-->
    <!--====================================================-->
    <main class="flex flex-wrap content-start ">

        <!--==================#2-1 HERO HTML ==================-->
        <section class="flex h-svh w-full border-2 relative">
            <video class="w-full h-full object-cover" muted loop autoplay
                src="assets/Images/Vault Hunters - Minecraft Modpack.webm"></video>
            <div
                class="flex flex-wrap content-start gap-1 absolute top-1/2 left-1/2 -translate-1/2 justify-center w-67 lg:w-80 *:text-center *:uppercase *:duration-300 *:ease nth-[3]:capitalize">
                <figure class="w-1/2 mb-3.5 lg:w-2/3"><img class="w-full object-cover"
                        src="assets/Images/vh-logo-lg-0eb785ac.webp" alt=""></figure>
                <h1 class="text-white font-bold w-full text-[20px] lg:text-[24px]">Third Edition: Update 21</h1>
                <span class=" text-[#d4d4d4] w-full capitalize!">Available Now</span>
                <a class="mt-3.5 bg-orange-500 shadow-[inset_0px_10px_15px_-10px_#fdd995,inset_0px_40px_40px_-30px_#fdd995] lg:px-16 lg:py-3 px-11 py-2.5 rounded-full font-semibold border-2 border-black transition-all duration-300 ease-out hover:shadow-[inset_0px_4px_10px_-4px_rgba(0,0,0,0.3)] hover:translate-y-0.5"
                    href="">play now</a>
            </div>
            <img class="absolute w-full h-8 -bottom-0.5 rotate-180" src="assets/Images/curve.svg" alt="">
        </section>

        <!--==================#2-2 UPDATE 21 HTML ==================-->
        <section class="h-[500px] w-full bg-[url(../Images/bg.svg)] bg-center bg-size-[40%_100%]">
            <div class="flex w">

            </div>
        </section>
    </main>
</body>

</html>
